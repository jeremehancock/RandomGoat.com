name: PHP currency

# Is randomgoat.com running the newest PHP patch release for its version line?
# Run weekly because the failure this guards against is silent: under nixpacks
# the site sat on PHP 8.3.15 and missed the critical PHP2Shell fix
# (CVE-2026-109618 / CVE-2026-109619) while the goats kept coming.
#
# Checks the live site, not a build, so it also catches a release that was
# published upstream but never deployed. When it fails, the remedy is a redeploy
# in Coolify, which rebuilds on the newest php:8.5-cli image.
# GitHub notifies whoever last edited this schedule when a scheduled run fails.
on:
  schedule:
    - cron: '47 6 * * 1'   # Mondays, 06:47 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Live site runs current PHP
    runs-on: ubuntu-latest
    steps:
      - name: Read the live site's PHP version
        id: site
        run: |
          # The home page is index.php, so it carries the version header, which
          # docker/php.ini keeps on for this check.
          version=$(curl -fsS -o /dev/null -D - https://randomgoat.com/ \
            | tr -d '\r' | sed -n 's/^[Xx]-[Pp]owered-[Bb]y: *PHP\/\([0-9.]*\).*/\1/p')
          if [ -z "$version" ]; then
            echo "::error::Could not read the PHP version from randomgoat.com"; exit 1
          fi
          echo "randomgoat.com runs PHP ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compare with the newest release on that line
        env:
          SITE_PHP: ${{ steps.site.outputs.version }}
        run: |
          line=$(echo "$SITE_PHP" | cut -d. -f1,2)
          # An unreachable php.net leaves this empty, which fails the check: an
          # unknown result is not a clean one.
          latest=$(curl -fsS "https://www.php.net/releases/index.php?json&version=${line}" \
            | jq -r '.version // empty' || true)
          if [ -z "$latest" ]; then
            echo "::error::Could not read the newest PHP ${line} release from php.net"; exit 1
          fi
          if [ "$SITE_PHP" != "$latest" ]; then
            echo "::error::randomgoat.com runs PHP ${SITE_PHP}, but ${latest} is out. Redeploy in Coolify."
            exit 1
          fi
          echo "randomgoat.com is on PHP ${latest}, the newest ${line} release."
